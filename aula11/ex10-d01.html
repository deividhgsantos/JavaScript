<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Seu País</title>
</head>
<body>
    <h1>Identificador</h1>
    Qual o seu país? <input type="pais" id="paistxt">
    <input type="button" value="Verificar" onclick="identificar()">
    <div id="res">

    </div>
    <script>
        function identificar() {
            var ptxt = window.document.getElementById('paistxt')
            var pais = String(ptxt.value)
            res.innerHTML = `<p>Seu país é <strong>${pais}</strong>.</p>`
            if (pais == `Brasil`) {
                res.innerHTML += `<p>Você é brasileiro!</p>`
            } else {
                res.innerHTML += `<p>Você é estrangeiro!</p>`
            }
        }
    </script>
</body>
</html>
